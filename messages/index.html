<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Messages | Forlab</title>
  <style>
    :root {
      --bg: #090d1a;
      --surface: rgba(18, 27, 52, .78);
      --surface-strong: #121b34;
      --text: #f5f7ff;
      --muted: #aab4d0;
      --accent: #8b7cff;
      --accent-2: #43d9c5;
      --border: rgba(255, 255, 255, .12);
      --danger: #ff8e9e;
      --shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(139, 124, 255, .24), transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(67, 217, 197, .12), transparent 32%),
        var(--bg);
    }

    .shell { width: min(940px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    .brand { color: var(--accent-2); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2.2rem, 6vw, 4.5rem); line-height: 1; }
    .subtitle { color: var(--muted); margin: 0 0 32px; }
    .panel, .message {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .panel { max-width: 430px; padding: 28px; }
    label { display: block; margin: 16px 0 7px; color: var(--muted); font-size: .9rem; }
    input {
      width: 100%; padding: 13px 15px; border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); background: rgba(0, 0, 0, .2); font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      margin-top: 22px; border: 0; border-radius: 12px; padding: 13px 18px;
      color: white; background: linear-gradient(135deg, var(--accent), #6657e8);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .65; }
    .status { min-height: 24px; color: var(--danger); }
    .toolbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin: 28px 0 18px; flex-wrap: wrap; }
    .toolbar-actions { display: flex; gap: 10px; align-items: center; }
    .toolbar button { margin: 0; padding: 9px 14px; }
    .delete-button { background: rgba(255, 142, 158, .16); color: var(--danger); }
    .select-all { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .9rem; }
    .select-all input, .message-select { width: auto; accent-color: var(--accent); }
    .messages { display: grid; gap: 16px; }
    .message { padding: 24px; margin: 0; }
    .message-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .message-heading { display: flex; gap: 12px; align-items: flex-start; }
    .message-name { font-size: 1.15rem; font-weight: 700; }
    .message-email, .message-date { color: var(--muted); font-size: .9rem; }
    .message-email:empty { display: none; }
    .message-body { margin: 18px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { color: var(--muted); padding: 32px 0; }
    .modal-backdrop {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
      background: rgba(3, 5, 12, .72); backdrop-filter: blur(8px); z-index: 10;
    }
    .modal {
      width: min(420px, 100%); padding: 28px; border: 1px solid var(--border);
      border-radius: 22px; background: var(--surface-strong); box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0 0 8px; }
    .modal p { color: var(--muted); margin: 0; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .modal-actions button { margin: 0; }
    .cancel-button { background: rgba(255, 255, 255, .1); }
    [hidden] { display: none !important; }
    body:not(.ready) main { visibility: hidden; }
    @media (prefers-reduced-motion: no-preference) {
      body { animation: page-in .7s cubic-bezier(.22, 1, .36, 1) both; }
      .panel { animation: rise-in .7s .08s cubic-bezier(.22, 1, .36, 1) both; }
      .message { animation: rise-in .55s cubic-bezier(.22, 1, .36, 1) both; }
      .message:nth-child(2) { animation-delay: .06s; }
      .message:nth-child(3) { animation-delay: .12s; }
      .message.is-new { animation: cinematic-in .8s cubic-bezier(.22, 1, .36, 1) both; }
      .modal { animation: modal-in .35s cubic-bezier(.22, 1, .36, 1) both; }
      @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes rise-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes modal-in { from { opacity: 0; transform: scale(.94) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      @keyframes cinematic-in { from { opacity: 0; transform: translateY(-28px) scale(.96); filter: blur(8px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    }
    .loader { position:fixed; inset:0; z-index:20; display:grid; place-items:center; overflow:hidden; background:#090d1a; transition:opacity .7s cubic-bezier(.22,1,.36,1),visibility .7s ease; } .loader.is-hidden { opacity:0; visibility:hidden; pointer-events:none; } .loader::before,.loader::after { content:""; position:absolute; border-radius:50%; filter:blur(2px); } .loader::before { width:430px; height:430px; background:radial-gradient(circle,rgba(139,124,255,.16),transparent 68%); } .loader::after { width:280px; height:280px; background:radial-gradient(circle,rgba(67,217,197,.14),transparent 68%); transform:translate(120px,-100px); } .loader-inner { position:relative; z-index:1; width:min(340px,calc(100% - 48px)); text-align:center; } .loader-mark { position:relative; width:104px; height:104px; margin:0 auto 28px; display:grid; place-items:center; border-radius:32px 42px 38px 45px; color:white; font-size:2rem; background:linear-gradient(145deg,#8b7cff,#5d51d9 68%,#43d9c5); box-shadow:18px 22px 45px rgba(67,217,197,.2),inset -10px -12px 18px rgba(32,25,105,.25); animation:loader-breathe 2.8s ease-in-out infinite; } .loader-mark::before,.loader-mark::after { content:""; position:absolute; border:1px solid rgba(139,124,255,.4); border-radius:50%; pointer-events:none; } .loader-mark::before { width:164px; height:58px; transform:rotate(28deg); } .loader-mark::after { width:190px; height:84px; border-color:rgba(67,217,197,.35); transform:rotate(-32deg); } .loader-dot { position:absolute; width:8px; height:8px; border-radius:50%; background:#43d9c5; box-shadow:0 0 0 5px rgba(67,217,197,.13),0 0 18px rgba(67,217,197,.5); animation:loader-orbit 2.8s linear infinite; } .loader-dot.one { top:4px; left:47px; } .loader-dot.two { right:3px; bottom:23px; animation-delay:-.9s; background:#ffd35a; box-shadow:0 0 0 5px rgba(255,211,90,.16),0 0 18px rgba(255,211,90,.5); } .loader-dot.three { bottom:3px; left:22px; animation-delay:-1.8s; } .loader-brand { margin:0; color:#f5f7ff; font-size:1.25rem; font-weight:900; letter-spacing:-.06em; } .loader-brand i { color:#43d9c5; font-style:normal; } .loader-copy { margin:7px 0 22px; color:#aab4d0; font-size:.9rem; } .loader-track { height:4px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.12); } .loader-progress { width:35%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#8b7cff,#43d9c5); box-shadow:0 0 14px rgba(67,217,197,.35); animation:loader-progress 1.2s cubic-bezier(.22,1,.36,1) infinite; } @keyframes loader-breathe { 0%,100% { transform:translateY(0) rotate(-4deg) scale(1); } 50% { transform:translateY(-8px) rotate(4deg) scale(1.04); } } @keyframes loader-orbit { 0% { transform:rotate(0deg) translateX(83px) rotate(0deg); } 100% { transform:rotate(360deg) translateX(83px) rotate(-360deg); } } @keyframes loader-progress { 0% { transform:translateX(-120%); } 55%,100% { transform:translateX(310%); } }
    @media(prefers-reduced-motion:reduce) { .loader-mark,.loader-dot,.loader-progress { animation:none; } .loader { transition:none; } }
  </style>
</head>
<body>
  <div class="loader" id="loader" role="status" aria-label="Loading Forlab"><div class="loader-inner"><div class="loader-mark" aria-hidden="true">✦<span class="loader-dot one"></span><span class="loader-dot two"></span><span class="loader-dot three"></span></div><p class="loader-brand">For<i>Lab</i>.</p><p class="loader-copy">Warming up your next small win</p><div class="loader-track" aria-hidden="true"><div class="loader-progress"></div></div></div></div>
  <main class="shell">
    <div class="brand">Forlab / private inbox</div>
    <h1>Messages</h1>
    <p class="subtitle">Messages sent through your portfolio, in one quiet place.</p>

    <section id="login-view" class="panel">
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">Open inbox</button>
        <p id="login-status" class="status" role="alert"></p>
      </form>
    </section>

    <section id="inbox-view" hidden>
      <div class="toolbar">
        <div id="count" class="subtitle"></div>
        <div class="toolbar-actions">
          <label class="select-all"><input id="select-all" type="checkbox"> Select all</label>
          <button id="delete-button" class="delete-button" type="button" disabled>Delete selected</button>
          <button id="logout-button" type="button">Log out</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
    </section>
  </main>

  <div id="delete-modal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-title">
      <h2 id="delete-title">Delete messages?</h2>
      <p id="delete-description"></p>
      <div class="modal-actions">
        <button id="cancel-delete" class="cancel-button" type="button">Cancel</button>
        <button id="confirm-delete" class="delete-button" type="button">Delete</button>
      </div>
    </section>
  </div>

  <script>
    const loader = document.querySelector("#loader");
    const loaderStartedAt = performance.now();
    window.addEventListener("load", () => {
      const remaining = Math.max(0, 900 - (performance.now() - loaderStartedAt));
      window.setTimeout(() => loader.classList.add("is-hidden"), remaining);
    });

    const API_URL = "https://forlab-api-8lay-ecb3cmfpd7gxbmba.italynorth-01.azurewebsites.net";
    const loginView = document.querySelector("#login-view");
    const inboxView = document.querySelector("#inbox-view");
    const loginForm = document.querySelector("#login-form");
    const loginButton = document.querySelector("#login-button");
    const loginStatus = document.querySelector("#login-status");
    const messagesElement = document.querySelector("#messages");
    const countElement = document.querySelector("#count");
    const selectAll = document.querySelector("#select-all");
    const deleteButton = document.querySelector("#delete-button");
    const deleteModal = document.querySelector("#delete-modal");
    const deleteDescription = document.querySelector("#delete-description");
    const cancelDelete = document.querySelector("#cancel-delete");
    const confirmDelete = document.querySelector("#confirm-delete");
    const tokenKey = "forlab_admin_token";
    let knownMessageIds = new Set();
    let polling = false;

    function showLogin() {
      loginView.hidden = false;
      inboxView.hidden = true;
    }

    function showInbox() {
      loginView.hidden = true;
      inboxView.hidden = false;
    }

    function renderMessages(messages, animateNew = false) {
      const selectedBeforeRender = new Set(selectedIds());
      countElement.textContent = `${messages.length} message${messages.length === 1 ? "" : "s"}`;
      messagesElement.replaceChildren();

      if (!messages.length) {
        messagesElement.innerHTML = '<p class="empty">Your inbox is empty.</p>';
        return;
      }

      for (const message of messages) {
        const card = document.createElement("article");
        card.className = `message${animateNew && !knownMessageIds.has(String(message._id)) ? " is-new" : ""}`;
        const date = new Date(message.createdAt).toLocaleString();
        card.innerHTML = `
          <div class="message-head">
            <div class="message-heading">
              <input class="message-select" type="checkbox" data-id="${message._id}" aria-label="Select message">
              <div>
              <div class="message-name"></div>
              <div class="message-email"></div>
              </div>
            </div>
            <div class="message-date"></div>
          </div>
          <p class="message-body"></p>
        `;
        card.querySelector(".message-name").textContent = message.name;
        card.querySelector(".message-email").textContent = message.email || "";
        card.querySelector(".message-date").textContent = date;
        card.querySelector(".message-body").textContent = message.message;
        card.querySelector(".message-select").checked = selectedBeforeRender.has(String(message._id));
        messagesElement.append(card);
      }
      knownMessageIds = new Set(messages.map((message) => String(message._id)));
      updateSelectionState();
    }

    function selectedIds() {
      return [...document.querySelectorAll(".message-select:checked")].map((input) => input.dataset.id);
    }

    function updateSelectionState() {
      const inputs = [...document.querySelectorAll(".message-select")];
      const selected = selectedIds();
      deleteButton.disabled = selected.length === 0;
      selectAll.checked = inputs.length > 0 && selected.length === inputs.length;
      selectAll.indeterminate = selected.length > 0 && selected.length < inputs.length;
    }

    async function deleteSelected() {
      const ids = selectedIds();
      if (!ids.length) {
        return;
      }

      deleteDescription.textContent =
        `This will permanently delete ${ids.length} selected message${ids.length === 1 ? "" : "s"}.`;
      deleteModal.hidden = false;
      confirmDelete.focus();
    }

    async function confirmDeletion() {
      const ids = selectedIds();
      if (!ids.length) {
        deleteModal.hidden = true;
        return;
      }

      confirmDelete.disabled = true;
      try {
        const response = await fetch(`${API_URL}/api/admin/messages`, {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${sessionStorage.getItem(tokenKey)}`
          },
          body: JSON.stringify({ ids })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "Unable to delete messages.");
        }
        deleteModal.hidden = true;
        await loadMessages(sessionStorage.getItem(tokenKey));
      } catch (error) {
        deleteDescription.textContent = error.message;
        updateSelectionState();
      } finally {
        confirmDelete.disabled = false;
      }
    }

    async function loadMessages(token) {
      const response = await fetch(`${API_URL}/api/admin/messages`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (response.status === 401) {
        sessionStorage.removeItem(tokenKey);
        showLogin();
        throw new Error("Your session expired. Please log in again.");
      }
      if (!response.ok) {
        throw new Error("Unable to load messages.");
      }

      const messages = await response.json();
      renderMessages(messages, knownMessageIds.size > 0);
      showInbox();
    }

    async function pollMessages() {
      const token = sessionStorage.getItem(tokenKey);
      if (!token || polling) return;
      polling = true;
      try {
        await loadMessages(token);
      } catch (error) {
        if (error.message.includes("session expired")) {
          loginStatus.textContent = error.message;
        }
      } finally {
        polling = false;
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      loginStatus.textContent = "";

      try {
        const response = await fetch(`${API_URL}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(loginForm)))
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Login failed.");
        }

        sessionStorage.setItem(tokenKey, result.token);
        loginForm.reset();
        await loadMessages(result.token);
      } catch (error) {
        loginStatus.textContent = error.message;
      } finally {
        loginButton.disabled = false;
      }
    });

    document.querySelector("#logout-button").addEventListener("click", () => {
      sessionStorage.removeItem(tokenKey);
      showLogin();
    });
    selectAll.addEventListener("change", () => {
      document.querySelectorAll(".message-select").forEach((input) => {
        input.checked = selectAll.checked;
      });
      updateSelectionState();
    });
    messagesElement.addEventListener("change", (event) => {
      if (event.target.classList.contains("message-select")) {
        updateSelectionState();
      }
    });
    deleteButton.addEventListener("click", deleteSelected);
    cancelDelete.addEventListener("click", () => {
      deleteModal.hidden = true;
    });
    confirmDelete.addEventListener("click", confirmDeletion);
    deleteModal.addEventListener("click", (event) => {
      if (event.target === deleteModal) {
        deleteModal.hidden = true;
      }
    });

    const savedToken = sessionStorage.getItem(tokenKey);
    if (savedToken) {
      loadMessages(savedToken)
        .catch((error) => {
          loginStatus.textContent = error.message;
        })
        .finally(() => {
          document.body.classList.add("ready");
        });
    } else {
      showLogin();
      document.body.classList.add("ready");
    }
    window.setInterval(pollMessages, 8000);
  </script>
</body>
</html>
